{{ define "main" }}
<div class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="content">{{ . }}</div>{{ end }}
</div>

{{ $pages := .Pages }}
<div class="card-grid">
  {{ range $pages }}
  <article class="card">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Date }}<div class="meta">{{ time.Format "Jan 2, 2006" . }}</div>{{ end }}
    <p>{{ .Summary | plainify | truncate 150 }}</p>
  </article>
  {{ end }}
</div>
{{ end }}
