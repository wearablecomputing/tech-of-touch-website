{{/* Renders optional Scholar + Website icon links for a person page. */}}
{{ if or .Params.scholar .Params.website }}
<div class="person-links">
  {{ with .Params.scholar }}
  <a class="person-link" href="{{ . }}" target="_blank" rel="noopener" aria-label="Google Scholar" title="Google Scholar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
    </svg>
  </a>
  {{ end }}
  {{ with .Params.website }}
  <a class="person-link" href="{{ . }}" target="_blank" rel="noopener" aria-label="Website" title="Website">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
    </svg>
  </a>
  {{ end }}
</div>
{{ end }}
