{{/* Triple image */}}
<figure class="post-img post-img-triple">
  <div class="post-img-row">
    <img src="{{ .Get "src1" }}" alt="{{ .Get "alt1" }}">
    <img src="{{ .Get "src2" }}" alt="{{ .Get "alt2" }}">
    <img src="{{ .Get "src3" }}" alt="{{ .Get "alt3" }}">
  </div>
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
