{{ define "main" }}
<section class="page-hero">
  <div class="page-grid">
    <div class="page-back-col">
      <a class="page-back-link" href="{{ "news/" | relURL }}">← Back to News</a>
    </div>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Date }}
      <p class="page-meta">{{ time.Format "January 2, 2006" . }}</p>
    {{ end }}
    <div class="page-content-col">
      <div class="content">
        {{ .Content }}
      </div>
    </div>
  </div>
</section>
{{ end }}
